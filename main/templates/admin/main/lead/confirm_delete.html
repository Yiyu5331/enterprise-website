{% extends "admin/base_site.html" %}
{% block content %}<h1>永久删除线索</h1><p style="color:#b42318">此操作不可恢复。日常业务请将线索状态改为“无效”，不要物理删除。</p><ul>{% for object in queryset %}<li>{{ object }}</li>{% endfor %}</ul><form method="post">{% csrf_token %}{% for object in queryset %}<input type="hidden" name="{{ action_checkbox_name }}" value="{{ object.pk }}">{% endfor %}<input type="hidden" name="action" value="permanent_delete_selected"><input type="hidden" name="confirmation" value="DELETE"><input type="hidden" name="post" value="yes"><input type="submit" value="确认永久删除" class="deletelink"></form>{% endblock %}

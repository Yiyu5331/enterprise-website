limit_req_zone $binary_remote_addr zone=huali_api:10m rate=2r/s;

server {
    listen 80;
    server_name ${SITE_DOMAIN} www.${SITE_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${SITE_DOMAIN} www.${SITE_DOMAIN};
    root /srv/huali/shared/prerender/current;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/${SITE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SITE_DOMAIN}/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=huali_api burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://unix:/run/huali/gunicorn.sock;
    }

    location /admin/ {
        add_header X-Frame-Options SAMEORIGIN always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://unix:/run/huali/gunicorn.sock;
    }

    location /static/ { alias /srv/huali/shared/static/; expires 7d; }
    location /assets/ { alias /srv/huali/shared/prerender/current/assets/; expires 30d; add_header Cache-Control "public, immutable"; }
    location = /sitemap.xml { alias /srv/huali/shared/prerender/current/sitemap.xml; expires 10m; }
    location = /robots.txt { alias /srv/huali/shared/prerender/current/robots.txt; expires 10m; }
    location ~ ^/media/(products|news)/(.*)$ { alias /srv/huali/shared/media/$1/$2; expires 30d; add_header Cache-Control "public, immutable"; }
    location /media/inquiry_attachments/ { return 404; }

    location /products/ {
        try_files $uri $uri/index.html @django_redirects;
    }
    location /news/ {
        try_files $uri $uri/index.html @django_redirects;
    }
    location @django_redirects {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://unix:/run/huali/gunicorn.sock;
    }
    location / { try_files $uri $uri/index.html /index.html; }
}
